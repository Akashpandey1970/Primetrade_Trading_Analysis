<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIMETRADE // Quantitative Terminal</title>
    <style>
        body { background-color: #0b0e14; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 40px; margin: 0; }
        .wrapper { max-width: 950px; margin: auto; border: 1px solid #21262d; border-radius: 12px; background: #161b22; padding: 32px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #21262d; padding-bottom: 20px; margin-bottom: 30px; }
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .kpi-card { background: #0d1117; border: 1px solid #21262d; border-radius: 8px; padding: 24px; text-align: center; transition: transform 0.2s; }
        .kpi-card:hover { transform: translateY(-2px); border-color: #58a6ff; }
        .label { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }
        .metric-val { font-size: 28px; font-weight: 700; color: #ffffff; }
        .status-banner { border-radius: 8px; padding: 20px; border: 1px solid #30363d; background: #0d1117; display: flex; justify-content: space-between; align-items: center; }
        .status-title { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <h2 style="margin:0; color:#58a6ff; font-weight: 600; letter-spacing: -0.5px;">📈 PRIMETRADE.AI // Full-Stack Portal</h2>
        <span style="font-size: 12px; color: #8b949e; border: 1px solid #30363d; padding: 4px 12px; border-radius: 12px;">Node: Active</span>
    </div>

    <div class="grid-cards">
        <div class="kpi-card"><div class="label">Total Managed Volume</div><div class="metric-val" id="trades">-</div></div>
        <div class="kpi-card"><div class="label">Net Realized Value</div><div class="metric-val" id="pnl">-</div></div>
        <div class="kpi-card"><div class="label">Execution Efficiency</div><div class="metric-val" id="winrate">-</div></div>
    </div>

    <div class="status-banner" id="banner">
        <div>
            <div class="label" style="margin-bottom: 4px;">Hypothesis Structural Resolution</div>
            <div class="status-title" id="verdict">Connecting to Pipeline Server Engine...</div>
        </div>
        <div style="text-align: right;">
            <div class="label" style="margin-bottom: 4px;">P-Value Index</div>
            <div class="metric-val" id="pvalue" style="font-size: 22px;">-</div>
        </div>
    </div>
</div>

<script>
    async function fetchSystemMetrics() {
        try {
            const response = await fetch('http://127.0.0.1:8000/api/metrics');
            const payload = await response.json();
            
            // Map live backend variables to browser DOM identifiers
            document.getElementById('trades').innerText = payload.metrics.totalTrades.toLocaleString();
            document.getElementById('winrate').innerText = payload.metrics.winRate + "%";
            document.getElementById('pvalue').innerText = payload.stats.pValue.toFixed(4);
            
            const pnlElement = document.getElementById('pnl');
            pnlElement.innerText = (payload.metrics.netPnL >= 0 ? '+' : '') + payload.metrics.netPnL.toLocaleString() + " USDC";
            pnlElement.style.color = payload.metrics.netPnL >= 0 ? '#34d399' : '#f87171';

            const verdictElement = document.getElementById('verdict');
            verdictElement.innerText = payload.stats.verdict;
            
            const banner = document.getElementById('banner');
            if (payload.stats.significant) {
                banner.style.borderColor = '#34d399';
                verdictElement.style.color = '#34d399';
            } else {
                banner.style.borderColor = '#f87171';
                verdictElement.style.color = '#f87171';
            }
        } catch (error) {
            document.getElementById('verdict').innerText = "Pipeline Off-Line";
            document.getElementById('verdict').style.color = '#f87171';
        }
    }
    window.onload = fetchSystemMetrics;
</script>
</body>
</html>
